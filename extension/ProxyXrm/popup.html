<!DOCTYPE html>
<html lang="en">
<head>
    <title>URL CRM</title>
    <style>
        #crmurl, button {
            box-sizing: border-box;
            width: 100%;
            padding: 8px;
            margin-top: 8px;
        }
    </style>
</head>
<body style="width: 300px; padding: 12px; font-family: 'Gill Sans', sans-serif;">
    <h1 style="text-align: center;margin-top: 0px;">XRM Proxy</h1> 
    <p style="text-align: justify;"><b>Nota:</b> non chiudere la tab in cui lavori, potrebbe invalidare le richieste</p>
    <select id="crmurl"></select>
    <button id="save" style="background: #ff9940;background: linear-gradient(90deg,rgba(255, 153, 64, 1) 0%, rgba(255, 196, 107, 1) 100%);; border-width: 0px;border-radius: 5px;"><b>Salva</b></button>
    <div id="status" style="text-align: center; display: none; margin-top: 8px; font-size: 12px;"></div>
    <script src="scripts/popup.js"></script>
</body>
</html>
